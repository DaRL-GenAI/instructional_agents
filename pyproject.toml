[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instructional-agents"
dynamic = ["version"]
description = "Reducing Teaching Faculty Workload through Multi-Agent Instructional Design"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Huaiyuan Yao"},
    {name = "Wanpeng Xu"},
    {name = "Justin Turnau"},
    {name = "Nadia Kellam"},
    {name = "Hua Wei"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "numpy>=1.24.0",
    "markitdown[pptx]>=0.1.0",
]

[project.optional-dependencies]
vector-db = ["chromadb>=0.4.0"]

# Grounding deps are needed ONLY when `--use-textbook PATH` is passed to
# run.py / evaluate.py. The vanilla course-writing path (no flag) does
# not import any of these. They are kept in a separate extras group so
# installs without grounding stay light (no ~400 MB torch download).
#
# Install:    pip install -e ".[grounding]"
# Includes:
#   - pymupdf            (PDF ingester)
#   - markdown-it-py     (markdown ingester)
#   - rank-bm25          (BM25 retrieval index)
#   - sentence-transformers, torch, transformers
#                        (semantic gates + optional cross-encoder reranker)
grounding = [
    "pymupdf>=1.24.0",
    "markdown-it-py>=3.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0,<6",
    "torch>=2.5,<3",
    "transformers>=5.0,<6",
]

[project.urls]
Homepage = "https://darl-genai.github.io/instructional_agents_homepage/"
Repository = "https://github.com/DaRL-GenAI/instructional_agents"
Issues = "https://github.com/DaRL-GenAI/instructional_agents/issues"
Paper = "https://arxiv.org/abs/2508.19611"

[project.scripts]
instructional-agents = "run:main"

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools]
py-modules = ["run", "api_server", "evaluate"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = [
    "catalog/*.json",
    "catalog/references/*.tex",
    "frontend/*.html",
    "frontend/*.js",
    "frontend/*.css",
    "src/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
